name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: mattjmorrison-homelab/actions-bash@6183880188049f6e03f086d403c9db38f8089c40 # main

      - name: Install golangci-lint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sfL "https://github.com/golangci/golangci-lint/releases/download/v2.13.1/golangci-lint-2.13.1-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1 golangci-lint-2.13.1-linux-amd64/golangci-lint
          chmod +x "$RUNNER_TEMP/bin/golangci-lint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build
        run: go build ./...

      - name: gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run

      - name: Test with coverage
        run: |
          go test -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out

      - name: Enforce 100% coverage
        run: |
          TOTAL="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')"
          echo "Total coverage: ${TOTAL}%"
          awk -v total="$TOTAL" 'BEGIN { exit !(total >= 100.0) }' || { echo "Coverage is below 100%"; exit 1; }

      - name: shellcheck deploy.sh
        run: shellcheck deploy.sh

      - name: bats
        run: bats test/

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: k8s-amd64
    # OIDC (todo #17): authenticates to OpenBao via GitHub's own OIDC token
    # instead of the Kubernetes-auth JWT this job used to use -- id-token:
    # write is what lets this job request one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: mattjmorrison-homelab/actions-openbao/sign-ssh@40a4bb9224176763ee986bab661770cd06af6921 # add-sign-ssh-action
        with:
          role: pi-fleet
          key-file: ${{ runner.temp }}/pi-health-deploy-key

      - name: Set SSH_KEY_FILE
        run: echo "SSH_KEY_FILE=${{ runner.temp }}/pi-health-deploy-key" >> "$GITHUB_ENV"

      - uses: mattjmorrison-homelab/actions-openbao@d67ac7726c64a846bd75a3513fbd1dce3f7b915b # add-oidc-auth-method
        with:
          role: pi-health-deploy-oidc
          auth-method: oidc
          kv-path: homelab/service/admin-discord/pi-health/uptime-webhook-url
          output-name: UPTIME_WEBHOOK_URL

      - uses: mattjmorrison-homelab/actions-openbao@d67ac7726c64a846bd75a3513fbd1dce3f7b915b # add-oidc-auth-method
        with:
          role: pi-health-deploy-oidc
          auth-method: oidc
          kv-path: homelab/service/admin-discord/pi-health/downtime-webhook-url
          output-name: DOWNTIME_WEBHOOK_URL

      - name: Deploy to pi1
        env:
          PI_SSH: pi@pi1.local
        run: ./deploy.sh

      - name: Verify deployed build SHA
        run: |
          SHA="${{ github.sha }}"
          for _ in $(seq 1 18); do
            RESULT="$(curl -sf "http://prometheus.monitoring.svc:9090/api/v1/query" \
              --data-urlencode "query=pi_health_build_info{sha=\"${SHA}\"}" \
              | jq -r '.data.result | length')"
            if [[ "$RESULT" -gt 0 ]]; then
              echo "Confirmed pi1 is running build ${SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "pi1 never reported build ${SHA} to Prometheus"
          exit 1
